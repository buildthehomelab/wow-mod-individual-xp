name: core-build
on:
  push:
    branches:
      - 'master'
  pull_request:

# A newer push to the same pull request or branch cancels the older run still queued or running
concurrency:
  group: core-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: azerothcore/reusable-workflows/.github/workflows/core_build_modules.yml@main
    with:
      module_repo: mod-individual-xp   # the module folder is mod-individual-xp; the repo name carries a wow- prefix
